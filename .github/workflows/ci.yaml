name: Verify SignalDesk
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: signaldesk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: signaldesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signaldesk -d signaldesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://signaldesk:ci-only-password@127.0.0.1:5432/signaldesk_test
      TEST_DATABASE_URL: postgresql://signaldesk:ci-only-password@127.0.0.1:5432/signaldesk_test
      APP_ORIGIN: http://127.0.0.1:3000
      ALLOW_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-failure-evidence, path: test-results/ }
