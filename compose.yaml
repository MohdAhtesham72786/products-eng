name: signaldesk
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: signaldesk
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    build: .
    image: signaldesk:local
    command: ["node", "dist/scripts/migrate.js"]
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Use the db hostname in DATABASE_URL for Compose}
    depends_on:
      db: { condition: service_healthy }
    healthcheck: { disable: true }
  app:
    image: signaldesk:local
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
  worker:
    image: signaldesk:local
    command: ["node", "dist/server/worker/index.js"]
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { disable: true }
    init: true
    restart: unless-stopped
    stop_grace_period: 150s
volumes:
  postgres-data:
